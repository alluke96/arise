<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: o app ocupa a tela toda e respeita o notch via safe-area.
         maximum-scale=1: o iOS não dá zoom ao tocar num campo de texto. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Arise</title>

    <!-- App na Tela de Início do iPhone: abre em tela cheia, sem barra do Safari. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Arise" />
    <meta name="theme-color" content="#0C0618" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />

    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #0C0618;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  <meta name="theme-color" content="#0C0618">
<link rel="icon" href="/arise/app/favicon.ico"/></head>

  <body>
    <noscript>Ative o JavaScript para usar o Arise.</noscript>
    <div id="root"></div>
    <script>
      // Service worker: guarda o app inteiro no aparelho para abrir sem internet.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('SW', e); });
        });
      }
    </script>
  <script src="/arise/app/_expo/static/js/web/entry-fe74df2cf7b5c9ecf72ac547687545f5.js" defer></script>
</body>
</html>
